<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery-DL WebUI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <nav class="sidebar" id="sidebar">
            <button class="toggle-btn" id="toggleSidebar">☰</button>
            
            <!-- Settings Header moved right with padding -->
            <h2 class="settings-header">Settings</h2>
            
            <div class="sidebar-content">
                <div class="update-section">
                    <button id="updateGalleryDl">Update gallery-dl (<span id="gd-version">...</span>)</button>
                    <span id="gd-status" class="status-msg"></span>
                    
                    <button id="updateYtDlp" style="margin-top: 10px;">Update yt-dlp (<span id="yt-version">...</span>)</button>
                    <span id="yt-status" class="status-msg"></span>
                </div>

                <div class="queue-control">
                    <button id="pauseBtn">Pause Queue</button>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <h1>Download Queue</h1>
            
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Paste URL here...">
                <button id="addBtn">Add to Queue</button>
            </div>

            <div class="task-list" id="taskList">
                <!-- Tasks injected here -->
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
