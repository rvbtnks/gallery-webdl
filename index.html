<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gallery-dl Web UI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <button id="menu-toggle" aria-label="Open menu">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <aside id="sidebar" class="closed">
    <div class="menu-header">
      <h2>Settings</h2>
      <button class="close-menu-btn" aria-label="Close menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="menu-item">
      <label><input type="checkbox" id="dark-mode-toggle" /> Dark Mode</label>
    </div>
    <div class="menu-item">
      <label for="concurrent-sites">Concurrent Sites:</label>
      <input type="number" id="concurrent-sites" min="1" max="10" value="3" />
    </div>
    <div class="menu-item">
      <button id="open-config-btn" class="btn secondary">Configure gallery-dl</button>
    </div>
    <div class="menu-item">
      <button id="update-gallery-dl" class="btn primary">Update gallery-dl</button>
      <span id="gallery-dl-version"></span>
      <span id="update-status"></span>
    </div>
    <div class="menu-item">
      <button id="update-yt-dlp" class="btn primary">Update yt-dlp</button>
      <span id="yt-dlp-version"></span>
      <span id="update-yt-status"></span>
    </div>
  </aside>

  <!-- Config Modal -->
  <div id="config-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>gallery-dl Configuration</h2>
        <button class="modal-close-btn" aria-label="Close modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="global">Global</button>
        <button class="tab-btn" data-tab="sites">Sites</button>
      </div>
      <div class="modal-body">
        <!-- Global Tab -->
        <div id="tab-global" class="tab-content active">
          <div class="config-section">
            <h3>Extractor Settings</h3>
            <p class="config-hint">Base settings for all extractors (base-directory, filename patterns, etc.)</p>
            <textarea id="config-extractor" class="config-editor" spellcheck="false"></textarea>
          </div>
          <div class="config-section">
            <h3>Downloader Settings</h3>
            <p class="config-hint">Download behavior (retries, timeout, rate limits, etc.)</p>
            <textarea id="config-downloader" class="config-editor" spellcheck="false"></textarea>
          </div>
        </div>
        <!-- Sites Tab -->
        <div id="tab-sites" class="tab-content">
          <div class="site-selector">
            <select id="site-dropdown">
              <option value="">Select a site...</option>
            </select>
            <button id="add-site-btn" class="btn primary">Add Site</button>
          </div>
          <div id="site-configs"></div>
        </div>
      </div>
      <div class="modal-footer">
        <span id="config-status"></span>
        <button id="save-config-btn" class="btn primary">Save Config</button>
      </div>
    </div>
  </div>

  <main>
    <h1>gallery-dl Queue</h1>
    <textarea id="url-input" placeholder="Enter one URL per line..."></textarea>
    <div class="controls">
      <button id="add-urls-button" class="btn primary">Add URLs</button>
      <button id="refresh-button" class="btn secondary">Refresh Status</button>
      <button id="clear-completed-button" class="btn warning">Clear Completed</button>
      <button id="clear-all-button" class="btn danger">Clear All</button>
      <button id="pause-resume-button" class="btn warning">Pause Queue</button>
      <button id="export-queue-button" class="btn secondary" style="margin-left:auto;">Export Queue</button>
    </div>
    <ul id="queue-list"></ul>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
